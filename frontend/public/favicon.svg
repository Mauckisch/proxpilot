<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">ProxPilot Icon</title>
  <desc id="description">
    Stylized letter P with connected infrastructure nodes
  </desc>

  <defs>
    <linearGradient id="proxpilot-gradient" x1="32" y1="224" x2="224" y2="32">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="node-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="4"
        flood-color="#020617"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <path
    d="M38 24h91c53 0 89 35 89 84 0 48-35 82-86 82H92v42H38V24Zm54 48v70h35c23 0 37-13 37-35 0-22-14-35-37-35H92Z"
    fill="url(#proxpilot-gradient)"
  />

  <g
    fill="none"
    stroke="#e5e7eb"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M86 86h59"/>
    <path d="M86 86v61"/>
    <path d="M145 86v61"/>
    <path d="M86 147h59"/>
    <path d="M86 147l59-61"/>
  </g>

  <g filter="url(#node-shadow)">
    <circle cx="86" cy="86" r="15" fill="#e5f7ff"/>
    <circle cx="145" cy="86" r="15" fill="#3b82f6"/>
    <circle cx="86" cy="147" r="15" fill="#2563eb"/>
    <circle cx="145" cy="147" r="15" fill="#22d3ee"/>
  </g>
</svg>
