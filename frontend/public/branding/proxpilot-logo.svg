<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 220"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">ProxPilot</title>
  <desc id="description">
    ProxPilot logo with connected infrastructure nodes
  </desc>

  <defs>
    <linearGradient id="proxpilot-gradient" x1="30" y1="205" x2="210" y2="25">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="pilot-gradient" x1="445" y1="60" x2="690" y2="165">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="node-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="4"
        flood-color="#020617"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <g transform="translate(10 8) scale(.78)">
    <path
      d="M38 24h91c53 0 89 35 89 84 0 48-35 82-86 82H92v42H38V24Zm54 48v70h35c23 0 37-13 37-35 0-22-14-35-37-35H92Z"
      fill="url(#proxpilot-gradient)"
    />

    <g
      fill="none"
      stroke="#e5e7eb"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M86 86h59"/>
      <path d="M86 86v61"/>
      <path d="M145 86v61"/>
      <path d="M86 147h59"/>
      <path d="M86 147l59-61"/>
    </g>

    <g filter="url(#node-shadow)">
      <circle cx="86" cy="86" r="15" fill="#e5f7ff"/>
      <circle cx="145" cy="86" r="15" fill="#3b82f6"/>
      <circle cx="86" cy="147" r="15" fill="#2563eb"/>
      <circle cx="145" cy="147" r="15" fill="#22d3ee"/>
    </g>
  </g>

  <text
    x="205"
    y="128"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="80"
    font-weight="700"
    letter-spacing="-3"
    fill="#111827"
  >
    Prox
  </text>

  <text
    x="380"
    y="128"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="80"
    font-weight="700"
    letter-spacing="-3"
    fill="url(#pilot-gradient)"
  >
    Pilot
  </text>

  <text
    x="211"
    y="171"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="600"
    letter-spacing="7"
    fill="#64748b"
  >
    MANAGE. MONITOR. MASTER.
  </text>
</svg>
