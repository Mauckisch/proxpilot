<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmox Management</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><h1>Proxmox Management</h1><p>Cluster, Nodes, VMs und LXC zentral verwalten</p></div><button id="refresh">Aktualisieren</button></header><main><div id="msg"></div><section id="summary"></section><section><h2>Nodes</h2><div id="nodes"></div></section><section><div class="head"><h2>VMs und LXC</h2><input id="search" placeholder="Name, VMID oder Node"></div><div class="table"><table><thead><tr><th>Typ</th><th>ID</th><th>Name</th><th>Node</th><th>Status</th><th>CPU</th><th>RAM</th><th>Aktionen</th></tr></thead><tbody id="guests"></tbody></table></div></section></main><aside id="taskDrawer"><div class="taskHead"><div><h2>Tasks</h2><small>Live-Ausgabe und Verlauf</small></div><button id="taskToggle">×</button></div><div id="tasks"></div></aside><button id="taskOpen">Tasks <span id="taskCount">0</span></button><dialog id="dlg"><form method="dialog"><h3 id="dt"></h3><p id="dx"></p><label id="ackWrap" class="ack hidden"><input id="ack" type="checkbox"> <span id="ackText"></span></label><div class="dialogActions"><button value="cancel" class="secondary">Abbrechen</button><button value="ok" id="dlgOk">Bestätigen</button></div></form></dialog><script src="/static/app.js"></script></body></html>
