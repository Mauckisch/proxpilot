services:
  backend:
    build:
      context: ./backend
    container_name: proxpilot-backend
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./ssh:/app/ssh:ro

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: proxpilot-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8085:80"
